# ═══════════════════════════════════════════════════════════════
# admin/config.yml — Decap CMS per Calcio H24
#
# Backend: GitHub con OAuth tramite il proxy gratuito di Netlify.
# NON è necessario ospitare il sito su Netlify.
#
# SETUP OBBLIGATORIO (una sola volta):
# ─────────────────────────────────────
# 1. Vai su: https://github.com/settings/developers
#    → "OAuth Apps" → "New OAuth App"
# 2. Compila così:
#    - Application name: Calcio H24 CMS
#    - Homepage URL: https://TUO-USERNAME.github.io/calcio-h24
#    - Authorization callback URL: https://api.netlify.com/auth/done
# 3. Clicca "Register application"
#    → copia il "Client ID" che ti viene mostrato
# 4. Sostituisci TUO-USERNAME qui sotto con il tuo username GitHub
# ═══════════════════════════════════════════════════════════════

backend:
  name: github
  # ⚠️ MODIFICA OBBLIGATORIA: sostituisci TUO-USERNAME con il tuo username GitHub
  repo: TUO-USERNAME/calcio-h24
  branch: main
  # Proxy OAuth gratuito di Netlify (funziona anche senza hosting su Netlify)
  base_url: https://api.netlify.com
  auth_endpoint: auth

# Cartella dove vengono salvate le immagini caricate dal pannello CMS
media_folder: "images/uploads"
public_folder: "/images/uploads"

# Lingua dell'interfaccia del pannello di amministrazione
locale: it

# ── Collezione: Le Nostre Notizie ──────────────────────────────
# Ogni articolo viene salvato come file Markdown in content/notizie/
# con nome slug generato automaticamente dalla data e dal titolo.
# update.py li legge e li compila in data/notizie_redazione.json.

collections:
  - name: "notizie"
    label: "📝 Le Nostre Notizie"
    label_singular: "Notizia"
    folder: "content/notizie"
    create: true
    # Formato nome file: AAAA-MM-GG-titolo-slug.md
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    # Ordinamento di default per data discendente
    sortable_fields: ["date", "title"]
    summary: "{{title}} — {{date}}"
    fields:
      - label: "Titolo"
        name:  "title"
        widget: "string"
        hint:  "Titolo dell'articolo (max 100 caratteri consigliato)"

      - label: "Data di pubblicazione"
        name:  "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        default: ""

      - label: "Autore"
        name:  "author"
        widget: "string"
        default: "Redazione Calcio H24"
        required: false

      - label: "Immagine di copertina"
        name:  "image"
        widget: "image"
        required: false
        hint:  "Immagine di anteprima (consigliata 1200×630 px)"

      - label: "Sommario / Anteprima"
        name:  "description"
        widget: "text"
        required: false
        hint:  "Breve descrizione visibile nelle card (max 200 caratteri)"

      - label: "Contenuto articolo"
        name:  "body"
        widget: "markdown"
        hint:  "Corpo dell'articolo — usa il toolbar per formattare"
