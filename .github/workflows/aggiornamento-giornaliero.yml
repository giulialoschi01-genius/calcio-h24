name: Aggiornamento Giornaliero Dati

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'content/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  aggiorna-dati:
    name: Scarica e aggiorna dati
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configura Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa dipendenze Python
        run: pip install -r requirements.txt

      - name: Esegui update.py
        env:
          
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python update.py

      - name: Commit e push dati aggiornati
        run: |
          git config user.name  "Calcio H24 Bot"
          git config user.email "bot@calcio-h24.github.io"
          git add data/
          if git diff --staged --quiet; then
            echo "Nessuna modifica ai dati - commit saltato"
          else
            git commit -m "Aggiornamento automatico - $(date +'%d/%m/%Y %H:%M UTC')"
            git push
          fi
